sources:
  - name: stripe
    database: raw
    schema: stripe
    tables:
      - name: payments
        config:
          freshness:
            warn_after: 
              count: 12
              period: hour
            error_after: 
              count: 12 
              period: hour
          loaded_at_field: _batched_at
        columns:
          - name: id
          - name: order_id
          - name: payment_method
          - name: status
          - name: amount
            description: Payment amount in cents.
          - name: created 
          - name: _batched_at
models:
  - name: stg_jaffle_shop__customers
    description: Staged customer data from jaffle shop app. One unique customer per row.
    columns:
      - name: customer_id
        description: Customer primary key.
        data_tests:
          - unique
          - not_null
      - name: first_name
        data_tests:
          - not_null

  - name: stg_jaffle_shop__orders
    description: Staged orders data from jaffle shop app. One unique order per row.
    columns:
      - name: order_id
        description: Order primary key.
        data_tests:
          - unique
          - not_null
      - name: customer_id
        description: Customer foreign key.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_jaffle_shop__customers')
                field: customer_id
      - name: order_date
        description: Date when order was placed.
        data_tests:
          - not_null
      - name: order_status
        description: '{{ doc("order_status") }}'
        data_tests:
          - accepted_values: 
              arguments:
                values: ['placed', 'shipped', 'completed', 'return_pending', 'returned']

sources:
  - name: jaffle_shop
    description: A clone of a Postgres database.
    database: raw
    schema: jaffle_shop
    tables:
      - name: customers
        description: Raw customers data.
        columns:
          - name: id
            description: Customer primary key.
            data_tests:
              - unique
              - not_null
          - name: first_name
            data_tests:
              - not_null

      - name: orders
        config:
          freshness:
            warn_after:
              count: 12
              period: hour
            error_after:
              count: 1
              period: day    
          loaded_at_field: _etl_loaded_at
        columns:
          - name: id
            data_tests:
              - unique
              - not_null
          - name: user_id
            data_tests:
              - not_null
              - relationships:
                  arguments:
                    to: source('jaffle_shop', 'customers')
                    field: id
          - name: order_date
            description: Date when order was placed.
            data_tests:
              - not_null
          - name: status
            description: '{{ doc("order_status") }}'
            data_tests:
              - accepted_values: 
                  arguments:
                    values: ['placed', 'shipped', 'completed', 'return_pending', 'returned']
